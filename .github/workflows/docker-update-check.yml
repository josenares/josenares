name: Monitor Docker Upstream Releases

on:
  schedule:
    # Runs every day at 04:00 AM UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual triggering to demonstrate the feature to recruiters

jobs:
  check-docker-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check if Docker Image Has Updated
        id: check
        uses: lucacome/docker-image-update-checker@v3
        with:
          base-image: bkimminich/juice-shop:latest
          image: bkimminich/juice-shop:latest

      - name: Trigger Regression Workflow if New Release Found
        if: steps.check.outputs.needs-updating == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'regression-pipeline.yml',
              ref: 'main'
            });
