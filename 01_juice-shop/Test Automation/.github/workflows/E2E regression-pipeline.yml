name: Automated E2E & Security Regression Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    # Set default execution directory for ALL run steps to the subdirectory
    defaults:
      run:
        working-directory: 01_juice-shop

    services:
    # Ephemeral Docker container running Juice Shop for the test run
      juice-shop:
        image: bkimminich/juice-shop:latest
        ports:
          - 3000:3000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v3.6.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 01_juice-shop/Test Automation/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers with Dependencies
        run: npx playwright install --with-deps chromium

      - name: Wait for Juice Shop Container Health
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Execute Playwright Regression Suite
        run: npx playwright test 'tests/Juice Shop UI Test Specification.spec.ts' --project=chromium --workers=1
        env:
          BASE_URL: http://localhost:3000

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-execution-report
          path: 01_juice-shop/Test Automation/playwright-report/playwright-execution-report.md
          retention-days: 14
